# Hydraulic Conveyor configuration. Docs: https://conveyor.hydraulic.dev/
#
# The hashbang include asks the Gradle plugin for a config that names the module's runtime
# classpath via the cross-platform configurations declared in `app/build.gradle.kts`, so
# Conveyor resolves the Compose Desktop artifacts for every target OS while packaging.
include "#!./gradlew -q :app:printConveyorConfig"

# Skiko (the Compose renderer) unpacks its native library into a temp directory at runtime;
# this config makes Conveyor extract the jars into the bundle instead, which is both faster
# at first paint and immune to `noexec` ones. Required for Compose Desktop apps generally:
# https://conveyor.hydraulic.dev/17.0/configure/jvm/#unpacking-native-libraries
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

# Per the official ProGuard recipe (https://conveyor.hydraulic.dev/17.0/configs/jvm/):
# the hashbang include's `app.inputs` (raw runtimeClasspath) is overridden below to
# consume the ProGuard-shrunk tree produced by `./gradlew proguardReleaseJars`;
# `${env.HOME}/.gradle` is where the per-OS skiko jars are re-imported from.
# UNIX-flavoured hosts only (the CI runner and dev boxes here are).
gradle-cache = ${env.HOME}/.gradle

app {
  # Kebab-case name used for files, package names and processes; the one derived from
  # the Gradle project name ("Azkar") fails Conveyor's validation on level >= 21.
  fsname = "azkar"
  display-name = "Azkar"
  rdns-name = "com.azkar.app"
  vendor = "jamhour1g"
  description = "A companion app for daily adhkar: prayer times, remembrances, and reminders."
  # Set to the public repo so Conveyor maps `make copied-site` onto the GitHub Releases
  # static-update feed (`$base-url` becomes .../releases/latest/download) and shipping the
  # build is free under the open-source license.
  vcs-url = "github.com/jamhour1g/Azkar-App"

  site {
    github {
      # Publishing is done by the release workflow, which passes the token through the
      # environment. When running Conveyor locally, a dummy value is enough for
      # `conveyor make site`.
      oauth-token = ${env.GITHUB_TOKEN}
    }
  }

  # Same committed mark as the jpackage config in `app/build.gradle.kts`. Re-export it from
  # `composeResources/drawable/brand.xml` when the brand changes so the installer, the dock
  # and the updates page agree.
  icons = "assets/icons/azkar.png"

  # Keep Skiko and DataStore's protobuf able to run under JDK 25 inside the bundled runtime.
  jvm-options = [
    "--enable-native-access=ALL-UNNAMED",
    "--sun-misc-unsafe-memory-access=allow",
  ]

  # Release inputs come from the shrunk output of `./gradlew proguardReleaseJars`.
  # The out-dir holds every runtimeClasspath jar except skiko natives (ProGuard
  # breaks their native code), so `remap` drops any skiko jar and the per-machine
  # lines below re-import exactly one skiko runtime each from the Gradle cache.
  inputs = [{
    from = "app/build/compose/tmp/main-release/proguard"
    remap = [
      "**"
      "-skiko-awt-runtime-*.jar"
    ]
  }]

  # Regenerated from `./gradlew -q :app:printConveyorConfig` — bump the skiko
  # version + hash dirs whenever compose (hence 0.153.0) changes.
  linux.amd64.inputs   = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-linux-x64/0.153.0/52c69e5e49218411436aeb5f895e78e0fd280710/skiko-awt-runtime-linux-x64-0.153.0.jar ]
  windows.amd64.inputs = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-windows-x64/0.153.0/a3b298cb651a0fd6c35fe05e4b66fea8cdcbf4d2/skiko-awt-runtime-windows-x64-0.153.0.jar ]
  mac.amd64.inputs     = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-x64/0.153.0/e0f6d9367128cfdc3fbd3dcd8c77731a1bc852e6/skiko-awt-runtime-macos-x64-0.153.0.jar ]
  mac.aarch64.inputs   = ${app.inputs} [ ${gradle-cache}/caches/modules-2/files-2.1/org.jetbrains.skiko/skiko-awt-runtime-macos-arm64/0.153.0/d5f8837e7eff0e6672a20cb9b0850ae3d4f91280/skiko-awt-runtime-macos-arm64-0.153.0.jar ]
}

# Ceiling on the config syntax Conveyor accepts; the tool refuses configs written for newer
# versions of itself, which keeps older scripts working if the schema shifts.
conveyor.compatibility-level = 23

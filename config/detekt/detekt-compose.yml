complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    allowedFunctionsPerFile: 25
    allowedFunctionsPerClass: 20
    # A method an interface declared is not a decision this class made. The rule is here to catch a
    # class that grew by accretion — one more helper after another, each individually reasonable — and
    # a class that only implements a port has grown by exactly one thing: someone widened the port.
    # Counting overrides made `PreviewCollectionsGateway`, which has no functions of its own and exists
    # only to stand in for `CollectionsGateway`, the one class in the app carrying a `@Suppress` for
    # this rule. Interfaces are unaffected: `allowedFunctionsPerInterface` still applies to them, which
    # is what keeps `CollectionsGateway` and `CollectionRepository` split by concern rather than merged.
    ignoreOverridden: true
    ignoreAnnotatedFunctions:
      - Preview

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview

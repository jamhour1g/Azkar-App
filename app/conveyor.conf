// Conveyor configuration for Azkar - Islamic Remembrance Desktop App
// Docs: https://conveyor.hydraulic.dev/22.0/

// Import config extracted from the Gradle build (app name, version, JVM settings, JavaFX modules, etc.)
// Regenerate with: ./gradlew :app:writeConveyorConfig
include required("generated.conveyor.conf")
include required("/stdlib/jdk/25/eclipse.conf")

app {
  // Display name shown to users in menus, installers, etc.
  display-name = "Azkar"

  // Reverse-DNS name used as a unique app identifier across all platforms.
  rdns-name = "com.azkar.app"

  // Vendor / publisher name shown in installers.
  vendor = "jamhour1g"

  // Human-readable description.
  description = "Azkar - Islamic Remembrance Desktop App"

  // Project license (SPDX identifier).
  license = "MIT"

  // Link to the source repository — also enables the free open-source tier.
  vcs-url = "https://github.com/jamhour1g/Azkar-App"

  // Where installers will check for updates.
  // When vcs-url points to GitHub this defaults to the latest GitHub Release,
  // so you normally don't need to set site.base-url explicitly.

  // Icon generation (simple label-based icon for now — replace with a real SVG/PNG later).
  icons {
    label = "AZ"
    gradient = "green"
  }

  // Target machines to build for.
  machines = ["windows.amd64", "mac.amd64", "mac.aarch64", "linux.amd64.glibc"]

  // JVM-specific settings.
  jvm {
    // java.logging is needed by ikonli (uses java.util.logging internally).
    // The Gradle plugin auto-detects JavaFX modules, but non-modular libs like
    // ikonli don't declare module dependencies, so we add it manually.
    modules += java.logging

    // JavaFX 25 on JDK 25 requires native access; suppress the restricted-method warnings.
    options += "--enable-native-access=javafx.graphics"

  }
}

app {

  // Windows-specific settings.
  windows {
    // Installs a Start Menu shortcut.
    start-menu-group = "Azkar"
  }

  // Linux-specific settings.
  linux {
    desktop-file."Desktop Entry".Categories = "Utility;"
  }
}

conveyor.compatibility-level = 19

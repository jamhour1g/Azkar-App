libraryAzkarMorningArabic=اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ
libraryAzkarMorningEnglish=O Allah, by You we enter the morning, by You we enter the evening, by You we live and by You we die, and to You is the resurrection.
libraryAzkarEveningArabic=أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ
libraryAzkarEveningEnglish=We have entered the evening and all sovereignty belongs to Allah. All praise is for Allah. None has the right to be worshipped except Allah alone, with no partner.
libraryAzkarTravelArabic=سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ
libraryAzkarTravelEnglish=Glory be to Him who has subjected this for us, and we could never have had it by our efforts. Surely, to our Lord we will return.

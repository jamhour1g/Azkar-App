# Main Content
dailyHadith=Daily Hadith
hadithExample="Verily, the best of you are those who have the best manners."
explanationExample=It was not part of the Prophet's character to speak or act indecently, nor would he deliberately do that. Indeed, he was of exemplary good character. The Prophet (may Allah's peace and blessings be upon him) used to say: The best among you in the sight of Allah are those who possess the best manners; in doing good, having a smiling face, refraining from harming others and bearing harm from them, and associating with people in a pleasant manner.
sourceExample=[Authentic hadith] - [Narrated by Bukhari & Muslim] - [Sahih Bukhari - 3559]

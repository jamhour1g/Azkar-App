# Code quality and tests for pull requests, run only when a maintainer allows them.
#
# The always-on workflow (ci.yml) already builds the app on three operating systems. This one
# is the deep pass: formatting, static analysis, the test suite and the coverage report. The
# reports are uploaded as artifacts when the run fails, so whoever has to look into it can read
# them; a green run uploads nothing.
#
# The gate is the `run-quality` label. Labelling a pull request needs triage or write access,
# so a label on a pull request *is* a maintainer's "go ahead" — a contributor cannot add one
# to their own pull request. The job below is skipped for every pull request that does not
# carry the label. The label is read from the pull request rather than from the event, so a
# run also happens when the author pushes more commits after the label was applied.
#
# The trigger is `pull_request`, never `pull_request_target`: the code this workflow checks
# out is untrusted, so it gets a read-only token and no secrets, and nothing it does writes
# to the repository.

name: PR Quality

on:
  pull_request:
    # `main` is this repository's default branch. The workflow was written against `main`
    # back when the default branch was still called `master`, so it never ran at all; the
    # branch has since been renamed and the filter now names the branch that exists.
    branches: ['main']
    # `labeled` is the maintainer's approval. `synchronize`, `reopened` and `ready_for_review`
    # are there so the pipeline picks the pull request up again once it has been allowed:
    # a run that only ever fired on `labeled` would go stale the moment the author pushed a
    # fix. The label check below still decides whether the job actually runs.
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and tests
    # The maintainer gate. A pull request without the label gets a skipped run, which is the
    # signal that the pipeline is waiting to be allowed rather than that something failed.
    if: contains(github.event.pull_request.labels.*.name, 'run-quality')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          # Zulu, not Temurin: Temurin 24+ ships no `jmods` (JEP 493) and ProGuard reads the
          # JDK's own classes from there. This is also the JDK the project is developed
          # against (SDKMAN's default), so CI and the local build agree on the toolchain.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `check` is the whole gate in one task: Spotless (formatting), detekt (static
      # analysis) and the test suite, which finalises into the JaCoCo coverage report. It is
      # the same task the project runs locally, so a green run here means a green
      # `./gradlew check` on the author's machine.
      - name: Code quality and tests
        run: ./gradlew check --console=plain
        env:
          CI: true

      # The release build shrinks the classpath with ProGuard, and ProGuard reads the JDK's
      # own classes from the `jmods` directory. A JDK that ships none — Temurin 24+ dropped
      # it in JEP 493 — fails there, in a wall of thousands of warnings that say nothing
      # about the cause. Running the task here puts that failure on the pull request
      # instead of on the tag that publishes the release.
      - name: Check the release classpath against ProGuard
        run: ./gradlew :app:proguardReleaseJars --console=plain
        env:
          CI: true

      # The reports are uploaded only when something failed. A green run has nothing to read,
      # and uploading every report on every run fills the repository's artifact storage with
      # copies of a result nobody looks at. When a step fails, these are the files that say
      # why, so they are the ones worth keeping.
      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14

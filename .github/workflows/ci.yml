# Validate changes on dev and require all supported platforms before a PR reaches production.
name: CI

on:
  pull_request:
    branches: ['dev', 'production']
  # Manual trigger for a full three-platform run.
  workflow_dispatch:

concurrency:
  # Cancel stale PR runs while keeping manual runs independent.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          # ProGuard needs jmods; Zulu still ships them for JDK 25.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Build, test, and check release shrinking
        run: ./gradlew build :app:smokeTestPackagedRuntime --console=plain
        env:
          CI: true

      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.20'

      - name: Test release asset validation
        run: ./scripts/merge_nucleus_release.main.kts self-test

      - name: Upload detekt reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          retention-days: 14

      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/packaging/
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload build artifacts
        if: success() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-jars
          path: 'app/build/libs/*.jar'
          retention-days: 7

  build-cross-platform:
    name: Build (${{ matrix.os }})
    # Full platform validation gates promotions to production. Feature PRs into dev stay fast.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'production')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test with Gradle
        run: ./gradlew build :app:smokeTestPackagedRuntime --console=plain
        env:
          CI: true

      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            app/build/reports/packaging/
          retention-days: 14

  production-promotion:
    name: Production promotion gate
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'production' }}
    needs: [build-linux, build-cross-platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux and cross-platform builds
        if: ${{ needs.build-linux.result != 'success' || needs.build-cross-platform.result != 'success' }}
        run: exit 1
      - run: echo "Linux, Windows, and macOS builds passed."

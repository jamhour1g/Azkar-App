# Trusted orchestration: contributor code runs only after owner approval, on read-only runners.
name: CI

on:
  pull_request_target:
    branches: ['dev', 'production']
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number approved by the maintainer'
        required: true
        type: string
      reviewed_sha:
        description: 'Full 40-character PR head SHA you reviewed'
        required: true
        type: string
      validate_installers:
        description: 'Also build and validate all eight installers (always required for production PRs)'
        type: boolean
        default: false
      skip_checks:
        description: 'Skip build jobs for an owner-reviewed documentation-only PR targeting dev'
        type: boolean
        default: false

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Authorize reviewed PR revision
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      base_branch: ${{ steps.pr.outputs.base_branch }}
      installers: ${{ steps.pr.outputs.installers }}
      skip_checks: ${{ steps.pr.outputs.skip_checks }}
    steps:
      - name: Resolve and authorize the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          FULL_INSTALLERS: ${{ inputs.validate_installers }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || inputs.reviewed_sha }}
        run: |
          trap 'echo "::error::Authorization failed at line $LINENO. Check the PR state, reviewed SHA, owner, and dispatch branch."' ERR
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT" == workflow_dispatch ]]; then
            test "$ACTOR" = "$OWNER"
            default_branch="$(gh api "repos/$REPOSITORY" --jq .default_branch)"
          fi
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<< "$pr")" = open
          test "$(jq -r .head.sha <<< "$pr")" = "$REVIEWED_SHA"
          test "$(jq -r .base.repo.full_name <<< "$pr")" = "$REPOSITORY"
          if [[ "$EVENT" == workflow_dispatch && "$DISPATCH_REF" != "refs/heads/$default_branch" ]]; then
            # The owner can rehearse their own workflow changes before landing on dev.
            test "$(jq -r .user.login <<< "$pr")" = "$OWNER"
            test "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPOSITORY"
            test "$DISPATCH_REF" = "refs/heads/$(jq -r .head.ref <<< "$pr")"
            test "$GITHUB_SHA" = "$REVIEWED_SHA"
          fi
          if [[ "$EVENT" == pull_request_target ]]; then
            test "$(jq -r .user.login <<< "$pr")" = "$OWNER"
          fi
          base="$(jq -r .base.ref <<< "$pr")"
          [[ "$base" == dev || "$base" == production ]]
          installers=false
          if [[ "$base" == production || "$FULL_INSTALLERS" == true ]]; then installers=true; fi
          skip_checks=false
          if [[ "$EVENT" == workflow_dispatch && "$SKIP_CHECKS" == true ]]; then
            test "$DISPATCH_REF" = "refs/heads/$default_branch"
            test "$base" = dev
            test "$installers" = false
            files_json="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
            # The pull request files API returns at most 3,000 files.
            changed_files="$(jq -r .changed_files <<< "$pr")"
            [[ "$changed_files" =~ ^[0-9]+$ && "$changed_files" -le 3000 ]]
            test "$(jq '[.[][]] | length' <<< "$files_json")" -eq "$changed_files"
            [[ "$changed_files" -gt 0 ]]
            files="$(jq -r '.[][] | .filename, (.previous_filename // empty)' <<< "$files_json")"
            while IFS= read -r file; do
              case "$file" in
                README.md|docs/*.md|data/src/main/resources/db/seed/SEED_DATA_NOTICE.md) ;;
                *) echo "Cannot skip CI for non-documentation file: $file" >&2; exit 1 ;;
              esac
            done <<< "$files"
            skip_checks=true
          fi
          {
            echo "installers=$installers"
            echo "skip_checks=$skip_checks"
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$REVIEWED_SHA"
            echo "base_sha=$(jq -r .base.sha <<< "$pr")"
            echo "base_branch=$base"
          } >> "$GITHUB_OUTPUT"
          contexts=('Azkar CI / Linux')
          if [[ "$installers" == true ]]; then contexts+=('Azkar CI / Installers'); fi
          for context in "${contexts[@]}"; do
            description='Reviewed revision queued for CI'
            if [[ "$skip_checks" == true ]]; then description='Owner-approved documentation-only skip queued'; fi
            gh api --method POST "repos/$REPOSITORY/statuses/$REVIEWED_SHA" \
              -f state=pending -f "context=$context" -f "description=$description" \
              -f "target_url=$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  build-linux:
    name: Build (ubuntu-24.04)
    needs: select
    if: needs.select.outputs.skip_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Check GitHub workflows
        run: ./scripts/ci/check_workflows.sh

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          # ProGuard needs jmods; Zulu still ships them for JDK 25.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Build, test, and check release shrinking
        run: ./gradlew build :app:smokeTestPackagedRuntime :app:verifyRoborazziJvm -Proborazzi.dumpUiTree=true --console=plain
        env:
          CI: true

      - name: Render documentation gallery
        run: ./gradlew :app:captureDownloadScreenshots --console=plain
        env:
          CI: true

      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.20'

      - name: Test release validation scripts
        run: |
          ./scripts/release/merge_nucleus_release.main.kts self-test
          ./scripts/release/publish_linux_repositories.main.kts self-test
          ./scripts/release/check_release_validation.main.kts self-test
          ./scripts/tests/test_ci_authorization.main.kts
          ./scripts/tests/test_release_workflow.main.kts
          ./scripts/tests/test_github_client.main.kts

      - name: Package Linux installers for promotion
        if: needs.select.outputs.installers == 'true'
        env:
          CI: true
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          ./gradlew :app:packageCurrentOS -PappVersion="0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --console=plain
      - name: Upload promotion installers
        if: needs.select.outputs.installers == 'true' && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: promotion-linux
          path: build/installers/
          if-no-files-found: error
          retention-days: 3

      - name: Upload detekt reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          retention-days: 14

      - name: Show native packaging errors
        if: failure()
        shell: bash
        run: |
          if [[ -d app/build/compose/logs ]]; then
            find app/build/compose/logs -name '*-err.txt' -exec cat {} +
          fi
      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/roborazzi/
            app/build/outputs/roborazzi/
            app/build/test-results/roborazzi/
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload build artifacts
        if: success() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-jars
          path: 'app/build/libs/*.jar'
          retention-days: 7

  build-cross-platform:
    name: Build installers (Windows/macOS)
    needs: select
    if: needs.select.outputs.installers == 'true' && needs.select.outputs.skip_checks != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Build and test with Gradle
        run: ./gradlew build :app:smokeTestPackagedRuntime --console=plain
        env:
          CI: true

      - name: Package installers for promotion
        shell: bash
        env:
          CI: true
        run: ./gradlew :app:packageCurrentOS -PappVersion="0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --console=plain
      - name: Upload promotion installers
        if: env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: promotion-${{ matrix.os }}
          path: build/installers/
          if-no-files-found: error
          retention-days: 3

      - name: Show native packaging errors
        if: failure()
        shell: bash
        run: |
          if [[ -d app/build/compose/logs ]]; then
            find app/build/compose/logs -name '*-err.txt' -exec cat {} +
          fi
      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
          retention-days: 14

  validate-installers:
    name: Validate all eight promotion installers
    needs: [select, build-linux, build-cross-platform]
    if: needs.select.outputs.installers == 'true' && needs.select.outputs.skip_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: promotion-*
          path: promotion-input
          merge-multiple: true
      - name: Validate complete installer set
        run: ./scripts/release/merge_nucleus_release.main.kts promotion-input promotion-validated "0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"

  report:
    name: Report required checks on the reviewed commit
    needs: [select, build-linux, build-cross-platform, validate-installers]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.select.outputs.pr_number }}
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.select.outputs.base_branch }}
          INSTALLERS_REQUIRED: ${{ needs.select.outputs.installers }}
          SKIP_CHECKS: ${{ needs.select.outputs.skip_checks }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          CROSS_RESULT: ${{ needs.build-cross-platform.result }}
          INSTALLERS_RESULT: ${{ needs.validate-installers.result }}
        run: |
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current=false
          if [[ "$(jq -r .state <<< "$pr")" == open && "$(jq -r .head.sha <<< "$pr")" == "$REVIEWED_SHA" && \
                "$(jq -r .base.sha <<< "$pr")" == "$BASE_SHA" && "$(jq -r .base.ref <<< "$pr")" == "$BASE_BRANCH" ]]; then
            current=true
          fi
          post_status() {
            gh api --method POST "repos/$REPOSITORY/statuses/$REVIEWED_SHA" \
              -f "state=$1" -f "context=$2" -f "description=$3" \
              -f "target_url=$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          state=failure
          description="Linux: $LINUX_RESULT; reviewed revision checked"
          if [[ "$SKIP_CHECKS" == true ]]; then description='Owner-approved documentation-only CI skip'; fi
          if [[ "$current" == true && ( "$LINUX_RESULT" == success || "$SKIP_CHECKS" == true ) ]]; then state=success; fi
          post_status "$state" 'Azkar CI / Linux' "$description"
          if [[ "$INSTALLERS_REQUIRED" == true ]]; then
            state=failure
            if [[ "$LINUX_RESULT" == success && "$CROSS_RESULT" == success && "$INSTALLERS_RESULT" == success && "$current" == true ]]; then state=success; fi
            post_status "$state" 'Azkar CI / Installers' "Native builds: $CROSS_RESULT; asset validation: $INSTALLERS_RESULT"
          fi
          {
            echo '### Reviewed PR checks'
            echo "- PR: #$PR_NUMBER"
            echo "- Reviewed head: $REVIEWED_SHA"
            echo "- Reviewed base: $BASE_BRANCH ($BASE_SHA)"
            echo "- PR still matches the reviewed revision: $current"
            echo "- Documentation-only skip: $SKIP_CHECKS"
            echo "- Linux: $LINUX_RESULT"
            echo "- Native builds: $CROSS_RESULT"
            echo "- Installer validation: $INSTALLERS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

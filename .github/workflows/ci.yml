# Trusted orchestration: contributor code runs only after owner approval, on read-only runners.
name: CI

on:
  pull_request_target:
    branches: ['dev', 'production']
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number approved by the maintainer'
        required: true
        type: string
      reviewed_sha:
        description: 'Full 40-character PR head SHA you reviewed'
        required: true
        type: string
      validate_installers:
        description: 'Also build and validate all eight installers (always required for production PRs)'
        type: boolean
        default: false
      profile_gradle:
        description: 'Upload task timings for the Linux Gradle build'
        type: boolean
        default: false
      skip_checks:
        description: 'Skip build jobs for an owner-reviewed documentation-only PR targeting dev'
        type: boolean
        default: false

concurrency:
  # GitHub assigns concurrency groups before evaluating job conditions.
  group: >-
    ${{ github.event.action == 'edited' && !github.event.changes.base.ref.from
        && format('ci-edit-{0}', github.run_id)
        || format('ci-pr-{0}', github.event.pull_request.number || inputs.pr_number) }}
  cancel-in-progress: true

permissions:
  contents: read

# Manual approval can run contributor code, so enforce read-only cache tokens on every trigger.
cache-mode: read

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Authorize reviewed PR revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == github.repository_owner &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      base_branch: ${{ steps.pr.outputs.base_branch }}
      installers: ${{ steps.pr.outputs.installers }}
      site_only: ${{ steps.pr.outputs.site_only }}
      skip_checks: ${{ steps.pr.outputs.skip_checks }}
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - name: Resolve and authorize the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          PROFILE_GRADLE: ${{ inputs.profile_gradle }}
          FULL_INSTALLERS: ${{ inputs.validate_installers }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || inputs.reviewed_sha }}
        run: ./.github/scripts/ci/authorize-pr.sh

  build-linux:
    name: Build (ubuntu-24.04)
    needs: select
    if: needs.select.outputs.skip_checks != 'true' && needs.select.outputs.site_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Check GitHub workflows
        run: ./.github/scripts/ci/check_workflows.sh

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          # ProGuard needs jmods; Zulu still ships them for JDK 25.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced
          cache-read-only: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Build, test, and check release shrinking
        run: bash .github/scripts/ci/retry_maven_429.sh ./gradlew build :app:smokeTestPackagedRuntime --console=plain ${{ inputs.profile_gradle && '--profile' || '' }}
        env:
          CI: true

      - name: Upload Linux Gradle profile
        if: inputs.profile_gradle && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-gradle-profile
          path: build/reports/profile/
          if-no-files-found: error
          retention-days: 7

      - name: Render documentation gallery
        run: bash .github/scripts/ci/retry_maven_429.sh ./gradlew :app:captureDownloadScreenshots --console=plain
        env:
          CI: true

      - name: Package Linux installers for promotion
        if: needs.select.outputs.installers == 'true'
        env:
          CI: true
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          bash .github/scripts/ci/retry_maven_429.sh ./gradlew :app:packageCurrentOS -PappVersion="0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --console=plain
      - name: Upload promotion installers
        if: needs.select.outputs.installers == 'true' && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: promotion-linux
          path: build/installers/
          if-no-files-found: error
          retention-days: 3

      - name: Upload detekt reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          retention-days: 14

      - name: Show native packaging errors
        if: failure()
        shell: bash
        run: |
          if [[ -d app/build/compose/logs ]]; then
            find app/build/compose/logs -name '*-err.txt' -exec cat {} +
          fi
      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload build artifacts
        if: success() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-jars
          path: 'app/build/libs/*.jar'
          retention-days: 7

  check-site:
    name: Check site and release scripts
    needs: select
    if: needs.select.outputs.skip_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Check TypeScript workspace
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          bun run check

      - name: Test the built download site in Chromium
        run: |
          bun --cwd site --bun playwright install --with-deps --only-shell chromium
          bun run test:browser

      - name: Test release validation scripts
        run: python3 -B -m unittest discover -s .github/scripts/tests

  build-cross-platform:
    name: Build installers (Windows/macOS)
    needs: select
    if: needs.select.outputs.installers == 'true' && needs.select.outputs.skip_checks != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Build and test with Gradle
        run: ./gradlew build :app:smokeTestPackagedRuntime --console=plain
        env:
          CI: true

      - name: Package installers for promotion
        shell: bash
        env:
          CI: true
        run: ./gradlew :app:packageCurrentOS -PappVersion="0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --console=plain
      - name: Upload promotion installers
        if: env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: promotion-${{ matrix.os }}
          path: build/installers/
          if-no-files-found: error
          retention-days: 3

      - name: Show native packaging errors
        if: failure()
        shell: bash
        run: |
          if [[ -d app/build/compose/logs ]]; then
            find app/build/compose/logs -name '*-err.txt' -exec cat {} +
          fi
      - name: Upload test reports
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
          retention-days: 14

  validate-installers:
    name: Validate all eight promotion installers
    needs: [select, build-linux, build-cross-platform]
    if: needs.select.outputs.installers == 'true' && needs.select.outputs.skip_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ needs.select.outputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the approved merge revision
        shell: bash
        env:
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: promotion-*
          path: promotion-input
          merge-multiple: true
      - name: Validate complete installer set
        run: python3 -B .github/scripts/release/merge_nucleus_release.py promotion-input promotion-validated "0.0.0-beta.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"

  report:
    name: Report required checks on the reviewed commit
    needs: [select, build-linux, check-site, build-cross-platform, validate-installers]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.select.outputs.pr_number }}
          REVIEWED_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
          BASE_BRANCH: ${{ needs.select.outputs.base_branch }}
          INSTALLERS_REQUIRED: ${{ needs.select.outputs.installers }}
          SKIP_CHECKS: ${{ needs.select.outputs.skip_checks }}
          SITE_ONLY: ${{ needs.select.outputs.site_only }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          SITE_RESULT: ${{ needs.check-site.result }}
          CROSS_RESULT: ${{ needs.build-cross-platform.result }}
          INSTALLERS_RESULT: ${{ needs.validate-installers.result }}
        run: ./.github/scripts/ci/report-status.sh

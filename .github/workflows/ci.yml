# Continuous Integration — build, test, and static analysis on every push and PR
name: CI

on:
  push:
    # `master`, not `main`: this is the branch the repository actually has, on both the fork
    # and the upstream. A workflow that waits for a branch that does not exist never runs.
    branches: ['master']
  pull_request:
    branches: ['master']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          # Temurin 24+ ships no `jmods` (JEP 493) and ProGuard needs them; Zulu still does.
          # This is also the JDK the project is developed against (SDKMAN's default), so CI and
          # the local build agree on the toolchain. The release workflow uses it for the same
          # reason; see docs/releasing.md.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
        env:
          CI: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
          retention-days: 14

      - name: Upload JaCoCo coverage reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 14

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: build-jars
          path: 'app/build/libs/*.jar'
          retention-days: 7

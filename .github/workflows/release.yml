# Build native installers with the Compose Multiplatform plugin's jpackage
# tasks and publish them as a GitHub Release.
#
# jpackage cannot cross-compile, so the matrix runs one runner per target OS.
# Runs only on tag pushes (e.g. v1.0.0).
#
# Tasks provided by org.jetbrains.compose:
#   Linux   -> :app:packageDeb
#   Windows -> :app:packageMsi
#   macOS   -> :app:packageDmg   (universal, arm64 + x64)

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.repository }}

jobs:
  build-and-release:
    name: Build ${{ matrix.target }} installer
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            task: ':app:packageDeb'
            artifact: azkar-linux
          - os: windows-latest
            target: windows
            task: ':app:packageMsi'
            artifact: azkar-windows
          - os: macos-latest
            target: macos
            task: ':app:packageDmg'
            artifact: azkar-macos

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 - pinned for act compatibility

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build
        env:
          CI: true

      - name: Package ${{ matrix.target }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.task }}
        env:
          CI: true

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          find app/build/compose/binaries -type f \( -name '*.deb' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - name: Upload installer
        shell: bash
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --repo "${{ github.repository }}" || \
             gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

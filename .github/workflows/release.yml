name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Choose release version and channel
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.batch.outputs.publish }}
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25 for release metadata
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: zulu
      - name: Set up Kotlin compiler for release metadata
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.21'
      - name: Restore Kotlin script dependencies
        id: kotlin-maven-cache
        if: env.ACT != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: kotlin-maven-v1-prepare-2.4.21-${{ hashFiles('scripts/release/*.main.kts', 'scripts/tests/*.main.kts') }}
      - name: Select Dev release batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: ./scripts/release/metadata.main.kts select-batch

      - name: Check GitHub workflows
        if: steps.batch.outputs.publish == 'true'
        run: ./scripts/ci/check_workflows.sh
      - name: Resolve version
        id: version
        if: steps.batch.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release/metadata.main.kts resolve-version

      - name: Require stable tag to be on production
        if: steps.version.outputs.channel == 'stable'
        run: ./scripts/release/metadata.main.kts verify-stable-source

      - name: Require installed-release evidence for Stable
        if: steps.version.outputs.channel == 'stable'
        run: ./scripts/release/check_release_validation.main.kts
      - name: Save Kotlin script dependencies
        if: env.ACT != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.kotlin-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.kotlin-maven-cache.outputs.cache-primary-key }}

  validate:
    name: Validate source and release shrinking
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Run checks and verify release inputs
        env:
          CI: true
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          chmod +x ./gradlew
          # Resolve the Compose JDK probe before the shared Linux cache is saved.
          bash scripts/ci/retry_maven_429.sh ./gradlew check :app:checkTagParity :app:proguardReleaseJars :app:checkRuntime -PappVersion="$APP_VERSION" --console=plain
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.21'
      - name: Restore Kotlin script dependencies
        id: kotlin-maven-cache
        if: env.ACT != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: kotlin-maven-v1-validate-2.4.21-${{ hashFiles('scripts/release/*.main.kts', 'scripts/tests/*.main.kts') }}
      - name: Test release validation scripts
        run: |
          ./scripts/release/merge_nucleus_release.main.kts self-test
          ./scripts/release/publish_linux_repositories.main.kts self-test
          ./scripts/release/check_release_validation.main.kts self-test
          ./scripts/tests/test_release_workflow.main.kts
          ./scripts/tests/test_github_client.main.kts
      - name: Save Kotlin script dependencies
        if: env.ACT != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.kotlin-maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.kotlin-maven-cache.outputs.cache-primary-key }}
      - name: Archive Kotlin script dependencies
        if: env.ACT != 'true'
        run: tar -czf "$RUNNER_TEMP/release-script-dependencies.tar.gz" -C "$HOME/.m2" repository
      - name: Upload Kotlin script dependencies
        if: env.ACT != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-script-dependencies
          path: ${{ runner.temp }}/release-script-dependencies.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload validation diagnostics
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            app/build/compose/logs/
          retention-days: 7


  package:
    name: Package (${{ matrix.id }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: windows-x64
            runner: windows-2025
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || runner.os == 'Linux' }}
      - name: Set up Bun
        if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'

      - name: Set up pnpm
        if: runner.os == 'Linux'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libgl1
      - name: Build packages for this host
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          CI: true
        run: |
          if [[ "${ACT:-false}" == true ]]; then APP_VERSION="${APP_VERSION:-0.0.0-beta.1}"; fi
          test -n "$APP_VERSION"
          bash scripts/ci/retry_maven_429.sh ./gradlew :app:packageCurrentOS -PappVersion="$APP_VERSION" --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ACT != 'true'
        with:
          name: packages-${{ matrix.id }}
          path: build/installers/
          if-no-files-found: error
          retention-days: 3
      - name: Upload packaging diagnostics
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-diagnostics-${{ matrix.id }}
          path: |
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
            app/build/compose/binaries/main-release/*/electron-builder.yml
            app/build/compose/binaries/main-release/*/builder-debug.yml
          retention-days: 3

  screenshots:
    name: Capture website and README screenshots
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Install screenshot runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Render download page and README gallery
        run: ./gradlew :app:captureDownloadScreenshots --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ACT != 'true'
        with:
          name: website-screenshots
          path: site/public/images/screen-*.webp
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Prepare release and signed repository site
    permissions:
      contents: write
    needs: [prepare, validate, package, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Refuse publication from local act runs
        run: |
          if [[ "${ACT:-false}" == true ]]; then
            echo 'Local act runs only build installers; publication is disabled.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: release-input
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-screenshots
          path: site/public/images
      - name: Download Kotlin script dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-script-dependencies
          path: ${{ runner.temp }}
      - name: Restore Kotlin script dependencies
        run: |
          mkdir -p "$HOME/.m2"
          tar -xzf "$RUNNER_TEMP/release-script-dependencies.tar.gz" -C "$HOME/.m2"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Build the download site
        run: |
          pnpm --filter azkar-tooling --filter azkar-download-site install --frozen-lockfile --ignore-scripts
          bun run build:site

      - name: Prepare release assets and merge architecture manifests
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: ./scripts/release/merge_nucleus_release.main.kts release-input release-assets "$APP_VERSION"
      - name: Install repository tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c gnupg libgl1
      - name: Import and verify Linux repository signing key
        env:
          REPO_PRIVATE_KEY: ${{ secrets.LINUX_REPO_SIGNING_KEY }}
          REPO_PASSPHRASE: ${{ secrets.LINUX_REPO_SIGNING_PASSPHRASE }}
        run: ./scripts/release/repository-site.sh import-key

      - name: Prepare draft release and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          PRE_RELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: ./scripts/release/github-release.sh prepare-draft

      - name: Collect rolling repository packages
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: ./scripts/release/repository-site.sh collect-packages

      - name: Build and sign rolling APT and RPM repositories
        env:
          REPO_PASSPHRASE: ${{ secrets.LINUX_REPO_SIGNING_PASSPHRASE }}
        run: ./scripts/release/repository-site.sh build

      - name: Upload expected deployed-file checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-site-checksums
          path: ${{ runner.temp }}/site-SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Upload generated Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository-site

  deploy:
    name: Deploy signed Linux repositories
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  finalize:
    name: Verify live repositories and publish release
    needs: [prepare, publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-site-checksums
          path: expected
      - name: Verify every deployed file against the signed site build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: ./scripts/release/repository-site.sh verify

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PRE_RELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: ./scripts/release/github-release.sh publish

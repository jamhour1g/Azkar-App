# Build native installers via Hydraulic Conveyor and publish as a GitHub Release.
# Conveyor builds for ALL platforms (Windows, macOS, Linux) from a single Linux runner.
# Runs only on tag pushes (e.g. v1.0.0).
#
# Docs: https://conveyor.hydraulic.dev/22.0/continuous-integration/

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.repository }}

jobs:
  build-and-release:
    name: Build installers & create release (Conveyor)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 - pinned for act compatibility

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build
        env:
          CI: true

      # Generates app/generated.conveyor.conf with correct paths for this runner.
      # Must run after 'build' so the JAR files exist in the expected locations.
      - name: Generate Conveyor config from Gradle
        run: ./gradlew :app:writeConveyorConfig

      - name: Run Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: make copied-site
          extra_flags: -f app/conveyor.conf
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1

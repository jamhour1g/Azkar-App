name: Release

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Choose release version and channel
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "${ACT:-false}" == true ]]; then
            version=0.0.0-beta.0
            tag="v$version"
            channel=dev
            prerelease=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable tags must be vMAJOR.MINOR.PATCH.'; exit 1; }
            tag="$GITHUB_REF_NAME"
            channel=stable
            prerelease=false
          else
            stable_tag="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r '[.[][] | select(.draft == false and .prerelease == false) | .tag_name][0] // empty')"
            base="${stable_tag#v}"
            if [[ -z "$stable_tag" ]]; then base=0.1.1; fi
            [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Latest stable release has an invalid version.'; exit 1; }
            IFS=. read -r major minor patch <<< "$base"
            next_patch=$((10#$patch + 1))
            version="${major}.${minor}.${next_patch}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            tag="v$version"
            channel=dev
            prerelease=true
          fi
          {
            echo "app_version=$version"
            echo "release_tag=$tag"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate source and release shrinking
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require stable tag to be on production
        if: needs.prepare.outputs.channel == 'stable'
        run: |
          git fetch origin production
          git merge-base --is-ancestor "$GITHUB_SHA" origin/production || {
            echo "Refusing a stable release: $GITHUB_SHA is not on production."
            exit 1
          }
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Run checks and verify release inputs
        env:
          CI: true
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          chmod +x ./gradlew
          ./gradlew check :app:checkTagParity :app:proguardReleaseJars -PappVersion="$APP_VERSION" --console=plain
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.20'
      - name: Test release validation scripts
        run: |
          ./scripts/merge_nucleus_release.main.kts self-test
          ./scripts/publish_linux_repositories.main.kts self-test
          ./scripts/check_release_validation.main.kts self-test
      - name: Require installed-release evidence for Stable
        if: needs.prepare.outputs.channel == 'stable'
        run: ./scripts/check_release_validation.main.kts


  package:
    name: Package (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: windows-x64
            runner: windows-2025
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libgl1
      - name: Build packages for this host
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          CI: true
        run: |
          if [[ "${ACT:-false}" == true ]]; then APP_VERSION="${APP_VERSION:-0.0.0-beta.0}"; fi
          test -n "$APP_VERSION"
          ./gradlew :app:packageCurrentOS -PappVersion="$APP_VERSION" --console=plain
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: env.ACT != 'true'
        with:
          name: packages-${{ matrix.id }}
          path: build/installers/
          if-no-files-found: error
          retention-days: 3
      - name: Upload packaging diagnostics
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: packaging-diagnostics-${{ matrix.id }}
          path: |
            app/build/reports/packaging/
            app/build/compose/logs/
            app/build/compose/tmp/*.args.txt
            app/build/compose/binaries/main-release/*/electron-builder.yml
            app/build/compose/binaries/main-release/*/builder-debug.yml
          retention-days: 3

  screenshots:
    name: Capture website and README screenshots
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Install screenshot runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Render download page and README gallery
        run: ./gradlew :app:captureDownloadScreenshots --console=plain
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: env.ACT != 'true'
        with:
          name: website-screenshots
          path: site/images/screen-*.png
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Prepare release and signed repository site
    permissions:
      contents: write
    needs: [prepare, validate, package, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Refuse publication from local act runs
        shell: bash
        run: |
          if [[ "${ACT:-false}" == true ]]; then
            echo 'Local act runs only build installers; publication is disabled.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1
        with:
          version: '2.4.20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: release-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website-screenshots
          path: site/images
      - name: Prepare release assets and merge architecture manifests
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: ./scripts/merge_nucleus_release.main.kts release-input release-assets "$APP_VERSION"
      - name: Install repository tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c gnupg libgl1
      - name: Import and verify Linux repository signing key
        env:
          REPO_PRIVATE_KEY: ${{ secrets.LINUX_REPO_SIGNING_KEY }}
          REPO_PASSPHRASE: ${{ secrets.LINUX_REPO_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$REPO_PRIVATE_KEY" || { echo 'Set LINUX_REPO_SIGNING_KEY before publishing.'; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/azkar-repo-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$REPO_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$key_id"
          expected_key="$(gpg --batch --with-colons --show-keys assets/keys/azkar-repository.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_id" = "$expected_key"
          echo "$key_id" > "$RUNNER_TEMP/azkar-repo-key-id"
          gpg --batch --armor --export "$key_id" > "$RUNNER_TEMP/azkar-repo.asc"
          printf 'signing check\n' > "$RUNNER_TEMP/azkar-signing-check"
          printf '%s\n' "$REPO_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$key_id" --detach-sign --output "$RUNNER_TEMP/azkar-signing-check.sig" \
            "$RUNNER_TEMP/azkar-signing-check"
      - name: Prepare draft release and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          PRE_RELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" --jq .body > "$notes_file"
          else
            previous="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r '[.[][] | select(.draft == false and .prerelease == true and (.tag_name | contains("-beta."))) | .tag_name][0] // empty')"
            note_args=()
            if [[ -n "$previous" ]]; then note_args+=(-f "previous_tag_name=$previous"); fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" "${note_args[@]}" --jq .body > "$notes_file"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true || {
              echo 'Refusing to replace an already published release. Use a new version.'
              exit 1
            }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "Azkar $APP_VERSION" --notes-file "$notes_file"
          else
            release_args=()
            if [[ "$PRE_RELEASE" == true ]]; then release_args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* --draft --title "Azkar $APP_VERSION" \
              --notes-file "$notes_file" --target "$GITHUB_SHA" "${release_args[@]}"
          fi
      - name: Collect rolling repository packages
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p "repository-input/$CHANNEL"
          cp release-assets/*.deb release-assets/*.rpm release-assets/SHA256SUMS "repository-input/$CHANNEL/"
          other=stable
          if [[ "$CHANNEL" == stable ]]; then other=dev; fi
          releases="$(gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100")"
          if [[ "$other" == stable ]]; then
            tag="$(jq -r '[.[][] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name // empty' <<< "$releases")"
          else
            tag="$(jq -r '[.[][] | select(.draft == false and .prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+(\\.[0-9]+)*$")))][0].tag_name // empty' <<< "$releases")"
          fi
          if [[ -n "$tag" ]]; then
            mkdir -p "repository-input/$other"
            gh release download "$tag" --dir "repository-input/$other" \
              --pattern '*-linux-x64.deb' --pattern '*-linux-x64.rpm' --pattern SHA256SUMS
          fi
      - name: Build and sign rolling APT and RPM repositories
        env:
          REPO_PASSPHRASE: ${{ secrets.LINUX_REPO_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          export GNUPGHOME="$RUNNER_TEMP/azkar-repo-gnupg"
          key_id="$(cat "$RUNNER_TEMP/azkar-repo-key-id")"
          ./scripts/publish_linux_repositories.main.kts \
            repository-input repository-site "$RUNNER_TEMP/azkar-repo.asc" "$key_id"
          (cd repository-site && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/site-SHA256SUMS"
      - name: Upload expected deployed-file checksums
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: repository-site-checksums
          path: ${{ runner.temp }}/site-SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Upload generated Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: repository-site

  deploy:
    name: Deploy signed Linux repositories
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  finalize:
    name: Verify live repositories and publish release
    needs: [prepare, publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-site-checksums
          path: expected
      - name: Verify every deployed file against the signed site build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          site_url="${PAGE_URL%/}"
          for attempt in {1..12}; do
            current="$(curl --fail --silent --show-error "$site_url/$CHANNEL-version.txt" || true)"
            if [[ "$current" == "$APP_VERSION" ]]; then break; fi
            if [[ "$attempt" == 12 ]]; then echo 'Deployed repository version did not become available'; exit 1; fi
            sleep 5
          done
          mkdir verified
          while IFS= read -r entry; do
            file="${entry:66}"
            [[ "$file" == ./* && "$file" != *..* ]]
            mkdir -p "verified/$(dirname "$file")"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              --output "verified/$file" "$site_url/${file#./}"
          done < expected/site-SHA256SUMS
          (cd verified && sha256sum --check ../expected/site-SHA256SUMS)
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PRE_RELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRE_RELEASE" --latest="$([[ "$PRE_RELEASE" == false ]] && echo true || echo false)"

# Build native installers for Windows, macOS and Linux with Hydraulic Conveyor
# and publish them as a GitHub Release.
#
# Conveyor builds all three targets from a single ubuntu runner and wires native
# auto-updates on each OS (MSIX/.appinstaller on Windows, Sparkle 2 on macOS,
# deb package + apt repository on Linux). No pre-releases: the update feed for
# `make copied-site` reads the /releases/latest endpoint. The pushed tag must
# match the Gradle project version in app/build.gradle.kts.
#
# Requires two repository secrets (see docs/releasing.md): SIGNING_KEY (the
# encrypted root-key value from ~/.config/hydraulic/conveyor/defaults.conf) and
# SIGNING_PASSPHRASE (the passphrase the key is encrypted under, injected via
# --passphrase=env:). Also needs app.vcs-url in conveyor.conf.

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.repository }}

jobs:
  build-and-release:
    name: Package and publish releases
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          # Temurin 24+ ships no `jmods` (JEP 493) and ProGuard needs them; Zulu still does.
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 - pinned for act compatibility

      # Validate the tagged revision before Conveyor packages and publishes it.
      - name: Run release checks and build ProGuard jars
        shell: bash
        env:
          CI: true
        run: |
          chmod +x ./gradlew
          ./gradlew check :app:checkTagParity :app:proguardReleaseJars --console=plain

      - name: Build and publish releases with Conveyor
        uses: hydraulic-software/conveyor/actions/build@7370ce828ff1cbc38b95426ffb2fd613492016d5 # v22.3
        with:
          command: make copied-site
          signing_key: ${{ secrets.SIGNING_KEY }}
          extra_flags: "--passphrase=env:SIGNING_PASSPHRASE"
          agree_to_license: 1
          conveyor_version: '22.3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
